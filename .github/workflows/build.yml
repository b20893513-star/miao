name: Build Miao (.deb rootless)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-v2

      - name: Install Theos
        run: |
          if [ ! -d "$THEOS/.git" ]; then
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
          else
            echo "Theos cache hit"
            git -C "$THEOS" submodule update --init --recursive || true
          fi

      - name: Install iPhoneOS16.5 SDK
        run: |
          mkdir -p "$THEOS/sdks"
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            curl -L --fail -o /tmp/sdk.tar.xz \
              https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
            tar -xJf /tmp/sdk.tar.xz -C "$THEOS/sdks"
            rm -f /tmp/sdk.tar.xz
          fi

      - name: Fix maintainer script permissions
        run: chmod 755 layout/DEBIAN/postinst

      - name: Build rootless package
        run: |
          GMAKE="$(brew --prefix make)/libexec/gnubin/make"
          set -o pipefail
          echo "ARCHS in Makefile:"; grep ARCHS Makefile
          "$GMAKE" clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee build.log
          ls -la packages/
          # Estrai dylib e verifica FAT arm64e (obbligatorio per SpringBoard A12+)
          deb=$(ls packages/*.deb | head -n1)
          tmp=$(mktemp -d)
          (cd "$tmp" && ar x "$GITHUB_WORKSPACE/$deb" && tar -xf data.tar.* 2>/dev/null || tar --lzma -xf data.tar.lzma)
          dylib=$(find "$tmp" -name 'Miao.dylib' | head -n1)
          echo "dylib=$dylib"
          lipo -info "$dylib"
          lipo -info "$dylib" | tee lipo.txt
          if ! grep -q arm64e lipo.txt; then
            echo "ERROR: Miao.dylib manca lo slice arm64e — SpringBoard non carichera il tweak"
            exit 1
          fi
          echo "OK: arm64e presente"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miao-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: miao-rootless-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Build Sileo repo tree
        run: |
          rm -rf sileo-repo
          mkdir -p sileo-repo/debs
          cp packages/*.deb sileo-repo/debs/
          python3 scripts/build-sileo-repo.py sileo-repo
          ls -la sileo-repo sileo-repo/debs

      - name: Publish Sileo repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./sileo-repo
          force_orphan: true

      - name: SSH install on iPhone (optional)
        env:
          PHONE_HOST: ${{ secrets.PHONE_HOST }}
          PHONE_PORT: ${{ secrets.PHONE_PORT }}
          PHONE_USER: ${{ secrets.PHONE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.PHONE_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PHONE_HOST:-}" ] || [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "Secrets PHONE_HOST / PHONE_SSH_KEY non impostati — skip SSH install"
            exit 0
          fi
          PORT="${PHONE_PORT:-22}"
          USER="${PHONE_USER:-mobile}"
          DEB=$(ls packages/*.deb | head -n 1)
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_phone
          chmod 600 ~/.ssh/id_phone
          cat > ~/.ssh/config <<EOF
          Host phone
            HostName ${PHONE_HOST}
            Port ${PORT}
            User ${USER}
            IdentityFile ~/.ssh/id_phone
            StrictHostKeyChecking accept-new
          EOF
          REMOTE="/var/mobile/Documents/$(basename "$DEB")"
          scp "$DEB" "phone:$REMOTE"
          ssh phone "bash -lc 'dpkg -i \"$REMOTE\" && (command -v sbreload >/dev/null && sbreload || true)'"
